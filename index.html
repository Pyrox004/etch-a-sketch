<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link href="/styles.css" rel="stylesheet">
</head>
<body>
    <h1>Etch-a-Sketch Game</h1>
    <div class="menu">
      <div class="resizer-container">
        <input class="input-number" type="number" required>
        <button class="resizer button">Resize Grid</button>
        <button class="erase button">Erase Grid</button>
      </div>
        <div class="color-container">
        <button class="black button">Black</button>
        <button class="rainbow button">Rainbow Colors</button>
        <button class="eraser button">Eraser</button>
        <button class="opacity button">Shading</button>
      </div>
      
    </div>
    <div class="container"></div>
  <script src="./script.js"></script>  
</body>
</html>
